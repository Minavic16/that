<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MR+TF Engine</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--green:#3fb950;--blue:#58a6ff;--red:#f85149}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
  .box{background:var(--surface);padding:32px;border-radius:12px;border:1px solid var(--border);width:100%;max-width:380px}
  h1{font-size:20px;margin-bottom:4px;color:var(--blue);font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;margin-top:12px}
  input{width:100%;padding:10px 12px;background:#1c2129;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none;transition:border .15s}
  input:focus{border-color:var(--blue)}
  button{width:100%;padding:11px;margin-top:18px;background:var(--green);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
  button:hover{opacity:.9}
  .err{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:var(--red);font-size:13px;padding:10px 12px;border-radius:6px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .err::before{content:'⚠';font-size:15px}
</style>
</head>
<body>
<div class="box">
  <h1>MR+TF Engine</h1>
  <div class="sub">Sign in to dashboard</div>
  {% if error %}
  <div class="err">{{ error }}</div>
  {% endif %}
  <form method="POST" autocomplete="on">
    <label for="username">Username</label>
    <input id="username" name="username" placeholder="Username" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Sign In</button>
  </form>
</div>
</body>
</html>
